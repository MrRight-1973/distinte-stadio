# Tiene sveglio l'archivio Supabase: nel piano gratuito il progetto va in pausa
# dopo 7 giorni senza richieste. Tre controlli a settimana bastano, anche d'estate.
# Servono i secrets del repository SUPABASE_URL e SUPABASE_KEY (Settings > Secrets and variables > Actions).
name: Sveglia archivio Supabase

on:
  schedule:
    - cron: "17 6 * * 1,3,5"  # lunedì, mercoledì e venerdì alle 6:17 UTC
  workflow_dispatch: {}

jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - name: Interroga il database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_KEY non configurati: niente da fare."
            exit 0
          fi
          URL="${SUPABASE_URL%/}"; URL="${URL%/rest/v1}"
          AUTH=()
          case "$SUPABASE_KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac
          CODICE=$(curl -sS -o risposta.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" "${AUTH[@]}" \
            "$URL/rest/v1/partite?select=id&limit=1")
          echo "Supabase risponde: HTTP $CODICE"
          if [ "$CODICE" != "200" ]; then
            cat risposta.txt; echo
            [ "$CODICE" = "404" ] && echo "Tabella 'partite' non trovata: esegui supabase/setup.sql nell'SQL Editor e controlla SUPABASE_URL (solo https://….supabase.co)."
            [ "$CODICE" = "401" ] && echo "Chiave rifiutata: in SUPABASE_KEY serve la chiave segreta (sb_secret_… o service_role)."
            exit 1
          fi
